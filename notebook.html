<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>笔记本 · 木客诡事</title>
<style>
:root{
  --ink:#2c2a25; --ink-2:#4a463c; --ink-3:#7d766a;
  --paper:#f6f1e3; --paper-2:#efe8d6; --line:rgba(120,105,80,.16);
  --gold:#b08a4a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%}
body{
  margin:0;font-family:'Source Han Sans SC','Noto Sans SC','Source Han Sans CN','思源黑体',sans-serif;
  color:var(--ink);
  background:
    radial-gradient(120% 80% at 50% 0%,#1d2c4d 0%,#111b33 45%,#070c1a 100%);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
/* R60：深蓝星空纸纹与暗角 */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    repeating-linear-gradient(93deg,rgba(255,255,255,.02) 0 2px,transparent 2px 7px),
    repeating-linear-gradient(1deg,rgba(0,0,0,.06) 0 1px,transparent 1px 5px),
    radial-gradient(70% 60% at 50% 45%,transparent 40%,rgba(0,0,0,.6) 100%);
  mix-blend-mode:multiply;
}
#app{position:relative;z-index:1;height:100%;display:flex;align-items:center;justify-content:center;padding:22px}

/* ================= 闭合的笔记本（R53：星空封面图 tn-cover.jpg） ================= */
#cover-stage{display:flex;flex-direction:column;align-items:center;gap:26px;perspective:1600px}
#book-cover{
  position:relative;width:min(300px,66vw);aspect-ratio:1795/3370;
  border-radius:6px 14px 14px 6px;cursor:pointer;overflow:hidden;
  box-shadow:
    0 30px 60px -18px rgba(0,0,0,.75),
    0 6px 16px rgba(0,0,0,.5),
    inset 0 0 0 1px rgba(255,255,255,.12);
  transition:transform .5s cubic-bezier(.2,.9,.3,1),box-shadow .5s;
  transform-style:preserve-3d;
}
#book-cover img{width:100%;height:100%;display:block;object-fit:cover;pointer-events:none}
#book-cover::after{    /* 书脊 */
  content:'';position:absolute;left:0;top:0;bottom:0;width:26px;border-radius:6px 0 0 6px;
  background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,.12) 60%,rgba(255,255,255,.08));
  border-right:1px solid rgba(0,0,0,.35);pointer-events:none;
}
#book-cover:hover{transform:translateY(-6px) rotateX(2deg);box-shadow:0 40px 70px -20px rgba(0,0,0,.8),0 8px 20px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.16)}
#book-cover:active{transform:translateY(-2px) scale(.99)}
/* R55-14：页内提示文字（原锁页提示迁至「随即我又想起顾异…」页底部） */
.pg-tip{margin-top:16px;padding-top:12px;border-top:1px dashed #ddd3bd;text-align:center;
  font-size:12.5px;line-height:2;color:#b0a688;letter-spacing:1px}
/* R60：闸门灰字提示（可点击跳转论坛私信） */
.gate-tip{cursor:pointer;margin-top:8px;padding-top:6px;border-top:none;color:#b6a98c}
.gate-tip:hover{color:#8d7f5c}
/* R54：锁页提示（quiz 未选 / 计划未发出） */
.locked-tip{margin-top:26px;padding:0 8px;text-align:center;font-size:13px;line-height:2.2;color:#b6a98c;letter-spacing:1px}
/* R54：笔记本背面（末页点击后合上显示） */
#bottom-stage{display:none;flex-direction:column;align-items:center;gap:26px;perspective:1600px}
#bottom-stage img{width:min(300px,66vw);aspect-ratio:1795/3370;object-fit:cover;
  border-radius:14px 6px 6px 14px;cursor:pointer;
  box-shadow:0 30px 60px -18px rgba(0,0,0,.75),0 6px 16px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.12);
  transition:transform .5s cubic-bezier(.2,.9,.3,1)}
#bottom-stage img:hover{transform:translateY(-6px)}
.cover-hint{
  font-size:12.5px;letter-spacing:5px;color:rgba(236,226,206,.62);
  animation:breathe 2.6s ease-in-out infinite;
}
.cover-hint b{font-weight:400;color:rgba(236,226,206,.9)}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:.95}}
.cover-back{position:absolute;left:30px;bottom:26px;font-size:12px;color:rgba(236,226,206,.4);letter-spacing:1px;text-decoration:none}
.cover-back:hover{color:rgba(236,226,206,.8)}

/* 星象锁：解锁页（R53：黑底与星空封面融合） */
#unlock-stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#101a33;overflow:hidden;z-index:5}
#unlock-stage.hide{opacity:0;pointer-events:none;transition:opacity .45s}
#unlock-img{max-width:100%;max-height:100%;object-fit:contain;cursor:crosshair;
  animation:lockIn .6s cubic-bezier(.2,.9,.3,1) both;user-select:none;-webkit-user-drag:none}
@keyframes lockIn{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
#unlock-img.shake{animation:lockShake .4s}
@keyframes lockShake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.unlock-hint{position:absolute;bottom:26px;left:0;right:0;text-align:center;
  font-family:'Source Han Serif SC','Noto Serif SC',serif;font-size:12.5px;letter-spacing:4px;
  color:rgba(255,255,255,.42);text-shadow:0 1px 3px rgba(0,0,0,.5)}
.unlock-nope{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);
  font-size:12px;letter-spacing:2px;color:rgba(255,255,255,.72);
  opacity:0;transition:opacity .25s;pointer-events:none}
.unlock-nope.on{opacity:1}

/* 翻开动画 */
#book-cover.opening{animation:openBook .62s cubic-bezier(.4,.1,.2,1) forwards}
@keyframes openBook{
  0%{transform:rotateY(0) translateZ(0)}
  55%{transform:rotateY(-34deg) translateX(-16px) scale(1.02)}
  100%{transform:rotateY(-88deg) translateX(-46px) scale(.98);opacity:0}
}

/* ================= 阅读态 ================= */
#reader{display:none;flex-direction:column;align-items:center;gap:14px;width:100%}
#reader.on{display:flex}
#book{
  position:relative;display:flex;
  width:min(96vw,calc(86vh * 22 / 21));aspect-ratio:22/21;height:auto;
  border-radius:8px;
  background:linear-gradient(180deg,#2c241b,#231c14);
  box-shadow:0 40px 80px -24px rgba(0,0,0,.85),0 10px 28px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.06);
  padding:10px;
}
/* 书脊阴影 */
#book::before{
  content:'';position:absolute;left:50%;top:8px;bottom:8px;width:56px;transform:translateX(-50%);
  background:linear-gradient(90deg,rgba(0,0,0,0),rgba(60,44,26,.45) 42%,rgba(0,0,0,.42) 50%,rgba(60,44,26,.45) 58%,rgba(0,0,0,0));
  pointer-events:none;z-index:3;
}
.pg{
  position:relative;flex:1;min-width:0;
  background:
    repeating-linear-gradient(0deg,transparent 0 25px,var(--line) 25px 26px),
    linear-gradient(104deg,#fbf7ec,#f5efe0 62%,#efe8d6);
  box-shadow:inset 0 0 40px rgba(150,130,95,.16);
  overflow:hidden;
}
.pg.left{border-radius:5px 2px 2px 5px;box-shadow:inset -18px 0 26px -12px rgba(80,60,35,.28),inset 0 0 40px rgba(150,130,95,.16)}
.pg.right{border-radius:2px 5px 5px 2px;box-shadow:inset 18px 0 26px -12px rgba(80,60,35,.28),inset 0 0 40px rgba(150,130,95,.16)}
.pg.only{border-radius:5px;box-shadow:inset 0 0 46px rgba(150,130,95,.18)}
.pg-body{
  position:absolute;inset:0;display:flex;flex-direction:column;
  padding:38px 32px 26px;padding-top:44px;overflow:hidden;
}
.pg-head{display:flex;align-items:baseline;gap:10px;flex:none;margin-bottom:14px}
.pg-who{font-size:11.5px;letter-spacing:3px;color:#9b8a6c}
.pg-no{font-family:'Source Han Serif SC','Noto Serif SC',serif;font-size:19px;letter-spacing:2px;color:#4b4335}
.pg-text{flex:1;overflow:hidden}
.pg-foot{min-height:24px;flex:none;display:flex;justify-content:center;font-size:11px;color:#a2988a;letter-spacing:1px;padding-top:8px}
.pg-body.hand .pg-text p{
  font-family:'Source Han Serif SC','Noto Serif SC','思源宋体',serif;
  font-size:18.67px;line-height:1.68;color:#312d26;margin:0 0 10px;text-indent:2em;
}
.pg-body.plain .pg-text p{
  font-family:'Source Han Sans SC','Noto Sans SC','思源黑体',sans-serif;
  font-size:18.67px;line-height:1.68;color:#2f2b25;margin:0 0 10px;text-indent:2em;
}
.pg-body.blank{background:linear-gradient(104deg,#faf6ec,#f2ecdc);}
.pg-body.blank .blank-mark{
  flex:1;display:flex;align-items:center;justify-content:center;
  font-family:'Source Han Serif SC',serif;color:#cbbfa8;font-size:26px;letter-spacing:12px;
}
.pg-body.blank .blank-note{
  position:absolute;left:0;right:0;bottom:22px;text-align:center;font-family:'Source Han Serif SC',serif;
  font-size:11.5px;letter-spacing:4px;color:#b8ab92
}
.art{margin:6px 0 14px;text-align:center}
.art img{width:100%;max-height:56%;display:block;margin:0 auto;border-radius:3px;object-fit:contain;
  box-shadow:0 5px 14px rgba(70,55,35,.22);filter:saturate(.96)}
.art figcaption{font-size:11px;color:#8d8271;letter-spacing:.5px;margin-top:6px;font-family:'Source Han Serif SC',serif}
.quiz{margin:14px 0 6px;padding:14px 16px;border:1px solid rgba(150,120,70,.35);border-radius:8px;background:rgba(255,250,236,.6)}
.quiz h4{margin:0 0 10px;font-size:13.5px;letter-spacing:1px;color:#6a5b41;font-weight:600}
.quiz .opts{display:flex;flex-wrap:wrap;gap:8px}
.quiz button{
  border:1px solid rgba(140,110,65,.4);background:#fffdf7;color:#5a4c35;border-radius:999px;
  padding:6px 16px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.18s;
}
.quiz button:hover{background:#f3e9d3;border-color:rgba(140,110,65,.7)}
.quiz button.on{background:#5a4c35;color:#f7f1e2;border-color:#5a4c35}
.quiz .qnote{margin:10px 0 0;font-size:11.5px;color:#8d8271;line-height:1.7}
.pg.turn-in{animation:pgIn .42s ease both}
@keyframes pgIn{from{opacity:.2;transform:translateX(10px)}to{opacity:1;transform:none}}

#nav{display:flex;align-items:center;gap:18px;color:rgba(240,232,214,.72);font-size:12.5px;letter-spacing:2px}
.nb-btn{
  border:1px solid rgba(230,218,192,.28);background:rgba(255,255,255,.05);color:rgba(240,232,214,.86);
  border-radius:999px;padding:7px 16px;font-size:12.5px;letter-spacing:2px;cursor:pointer;font-family:inherit;
  transition:.18s;backdrop-filter:blur(4px);
}
.nb-btn:hover{background:rgba(255,255,255,.13);border-color:rgba(230,218,214,.5)}
.nb-btn:disabled{opacity:.3;cursor:default}
#pg-count{min-width:86px;text-align:center;font-variant-numeric:tabular-nums}

/* 右下角剧情提醒 */
#nb-toast{
  position:fixed;right:20px;bottom:22px;z-index:60;max-width:min(360px,88vw);
  background:rgba(26,23,19,.96);color:#f2ecdf;border:1px solid rgba(255,255,255,.1);
  border-radius:14px;padding:14px 42px 14px 16px;font-size:13.5px;line-height:1.7;
  box-shadow:0 18px 40px rgba(0,0,0,.55);cursor:pointer;
  transform:translateY(16px);opacity:0;pointer-events:none;transition:.34s cubic-bezier(.2,.9,.3,1);
}
#nb-toast.on{transform:none;opacity:1;pointer-events:auto}
#nb-toast b{color:#ffd88a;font-weight:600}
#nb-toast .t-sub{display:block;margin-top:3px;font-size:11.5px;color:#a89a86;letter-spacing:1px}
#nb-toast .t-x{
  position:absolute;top:8px;right:10px;width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:#8d8478;font-size:14px;
}
#nb-toast .t-x:hover{background:rgba(255,255,255,.1);color:#fff}

/* 用于分页测量的隐藏页：与真实页面同排版，但不裁切内容 */
#measure{position:fixed !important;inset:auto !important;left:-9999px !important;top:0 !important;
  overflow:visible !important;visibility:hidden;padding:0 !important}
#measure .pg-text{overflow:visible !important;flex:0 0 auto !important;padding-bottom:1px}  /* 1px 内边距阻止末段 margin 溢出父级，保证测量与真实页一致 */

/* 手机：单页 */
/* 矮视口（TN 本较矮）：选择题卡片紧凑排版，避免单独一页放不下 */
@media (max-height:620px){
  .quiz{margin:10px 0 4px;padding:10px 12px}
  .quiz h4{margin:0 0 8px;font-size:12.5px}
  .quiz button{padding:5px 11px;font-size:11.5px}
  .quiz .opts{gap:6px}
  .quiz .qnote{margin-top:8px;font-size:11px}
}

@media (max-width:819px){
  #app{padding:10px}
  #book{width:min(94vw,calc(88vh * 11 / 21));aspect-ratio:11/21;height:auto;padding:7px}
  #book::before{display:none}
  .pg-body{padding:24px 22px 18px}
  .pg-who{font-size:10.5px}
  .pg-no{font-size:16px}
  /* R69：手机端不再压缩字号 —— 保持四号字(18.67px)，改为「单页显示」补偿容量 */
  .pg-body.hand .pg-text p{font-size:18.67px;line-height:1.68;margin-bottom:10px}
  .pg-body.plain .pg-text p{font-size:18.67px;line-height:1.68;margin-bottom:10px}
  .pg-body{padding:34px 20px 20px}
  .cov-title{font-size:34px;right:40px;top:44px}
  .cov-tag{left:40px;bottom:64px}
  .cov-frame{inset:22px 18px 22px 34px}
  #nav{gap:6px;flex-wrap:nowrap;justify-content:center;width:100%}
  .nb-btn{padding:6px 10px;font-size:11.5px;letter-spacing:1px;white-space:nowrap}
  #pg-count{min-width:70px;font-size:11.5px}
  #nb-toast{right:10px;bottom:12px;max-width:calc(100vw - 20px)}
}
/* R56：图片点击放大 */
#img-zoom{position:fixed;inset:0;z-index:2000;background:rgba(4,6,10,.94);cursor:zoom-out;
  display:none;align-items:center;justify-content:center;padding:24px}
#img-zoom.on{display:flex}
#img-zoom img{max-width:94vw;max-height:92vh;object-fit:contain;border-radius:4px;
  box-shadow:0 30px 80px rgba(0,0,0,.8);animation:zoomIn .22s ease-out}
@keyframes zoomIn{from{opacity:.2;transform:scale(.94)}to{opacity:1;transform:none}}
body.zom{overflow:hidden}
.zomable{cursor:zoom-in}
</style>
</head>
<body>
<div id="app">

  <!-- 星象锁：先找到摩羯座（R53：封面图即 tn-cover.jpg，点图中摩羯座星座解锁） -->
  <div id="unlock-stage">
    <img id="unlock-img" src="assets/nb-unlock.jpg" alt="星象笔记本封面">
    <div class="unlock-nope" id="unlock-nope">这里没有动静……</div>
    <div class="unlock-hint">只有点击某一符号的左下角才能解锁该手账本<br>请回忆前面的剧情，判断出正确的符号</div>
  </div>

  <!-- 闭合状态（R53：星空封面图） -->
  <div id="cover-stage">
    <div id="book-cover" role="button" tabindex="0" aria-label="翻开笔记本">
      <img src="assets/tn-cover.jpg" alt="星象笔记本封面">
    </div>
    <div class="cover-hint">点击 <b>翻开</b></div>
    <div id="nb-ver" style="position:fixed;left:12px;bottom:10px;z-index:1200;font-size:11px;
      color:rgba(190,200,220,.35);letter-spacing:1px;user-select:none">vR73</div>
  </div>

  <!-- R54：笔记本背面（阅读到最后一页点击后显示） -->
  <div id="bottom-stage">
    <img src="assets/nb-bottom.jpg" alt="笔记本背面">
    <div class="cover-hint">点击 <b>回到封面</b></div>
  </div>

  <!-- 阅读状态 -->
  <div id="reader">
    <div id="book">
      <div class="pg left" id="pg-left"><div id="left-inner"></div></div>
      <div class="pg right" id="pg-right"><div id="right-inner"></div></div>
    </div>
    <div id="nav">
      <button class="nb-btn" id="btn-prev">‹ 上一页</button>
      <span id="pg-count">1 / 1</span>
      <button class="nb-btn" id="btn-next">下一页 ›</button>
      <button class="nb-btn" id="btn-close">合上</button>
    </div>
  </div>

  <div id="measure" style="position:fixed;left:-9999px;top:0;visibility:hidden;padding:0;display:block;font-family:'Source Han Sans SC',sans-serif"></div>

  <div id="bgm-toggle" style="display:none;position:fixed;right:16px;top:12px;z-index:900;
    padding:11px 20px;border-radius:999px;background:rgba(30,40,66,.82);color:#e8dfc9;
    font-size:16px;letter-spacing:1px;cursor:pointer;user-select:none;
    box-shadow:0 4px 14px rgba(0,0,0,.28)">🔊 音乐开</div>
  <div id="nb-toast">
    <span class="t-x" id="toast-x">✕</span>
    <div id="toast-body"></div>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ================= 内容 ================= */
  var CHAPTERS = [
    { who:'顾异', no:'', date:'', paras:[
      '好消息：终于到宾馆了。',
      '坏消息：这辈子没住过条件这么差的宾馆。',
      '一楼大厅（其实就是一个堂屋）没有空调，这边的空气湿度还高，又闷又热，像个蒸笼。',
      '老板兼前台还安慰我们说还好现在是夏天，冬天的话这边没有暖气，大厅跟外头一样冷，我们会更惨。',
      '安慰得很好，下次别安慰了。'
    ], arts:[
      ['assets/nb-hotel.jpg','芳芳宾馆']
    ]},

    { who:'顾异', no:'', date:'', paras:[
      '没想到二楼的房间还挺整洁，心情好点了。',
      '我跟教授一人一间挨着。',
      '休整好之后，我跟教授踏上了去木客村的路。',
      '通往木客村的路是一个长长的下坡路，信号越来越差。',
      '看来这里的信号强弱跟地势高低和距离木客镇的距离有关系。',
      '等到了木客村，估计一点信号都没有。'
    ], arts:[
      ['assets/nb-mushroom2.jpg','沿途看到的蘑菇 1/3'],
      ['assets/nb-mushroom3.jpg','沿途看到的蘑菇 2/3'],
      ['assets/nb-mushroom4.jpg','沿途看到的蘑菇 3/3'],
      ['assets/nb-lumber.jpg','去木客村路上途经的木材加工厂'],
      ['assets/map.jpg','我画的路线图']
    ]},

    { who:'顾异', no:'', date:'', paras:[
      '木客村竟然真的家家户户都拜鬼。',
      '教授在来的路上就跟我说过，他们信奉鬼的力量，认为鬼很强大，可以满足他们的愿望。',
      '我的评价是：学不好数理化，生活处处是魔法。'
    ], arts:[['assets/nb-village.jpg','木客村全貌']]},

    { who:'顾异', no:'', date:'', paras:[
      '来参观陨石了。',
      '这个陨石正如村长所说，特别像他们村供奉的阴阳眼泥塑，所以他认为这个陨石跟木客村有缘分。',
      '这么多年来，多少人出钱他都不卖。'
    ], arts:[['assets/nb-meteor.jpg','村长收藏的陨石']], trigger:'meteor'},

    /* 隔一页空白（换字体） */
    { blank:true },

    { who:'万家', no:'', date:'', trigger:'mon', paras:[
      '看完顾异的所有笔记，我对他的怀疑并没有打消。',
      '教授出事的那天他说自己去写生了，但没有任何人证物证。',
      '如果他跟教授约好了在木客崖见面呢？',
      '宾馆到木客崖的距离也没有很远，走得再慢一个小时也能到了。',
      '如果他九点多就出发去木客崖，藏在某棵树后面不被方勇看到，等到教授见到他后，再把教授推下木客崖，也不是不可能的事。',
      '但是这些只是猜测，我需要更多关于木客村的信息。',
      '等参观完木客村我再来更新日记吧。'
    ]},

    { who:'万家', no:'', date:'', quiz:true, paras:[
      '新的一天又开始了。',

  /* 单块就溢出的长段落：按最靠中间的标点拆成两半（TN 窄页需要）。

  function splitParagraph(b){
    if(!b || b.t !== 'p') return null;
    var v = String(b.v || '');

    }
    var cut = best + 1;
    if(cut <= 0 || cut >= v.length) return null;
    return [{ t:'p', v: v.slice(0, cut) }, { t:'p', v: v.slice(cut) }];
  }

  }
  $('toast-x').addEventListener('click', function(e){ e.stopPropagation(); toast.classList.remove('on'); });
  /* R54-9：背面点击回到封面 */
  bottomStage.addEventListener('click', function(){
    bottomStage.style.display = 'none';
    coverStage.style.display = '';
    /* R65：把阅读位置回退到末页前一位，重进笔记本时不会立刻又弹封底 */
    try{ localStorage.setItem('nb_cur', String(Math.max(0, lastContentIdx() - 2))); }catch(e){}   /* 退两页：双页视图才不会含末内容页 */
    shownBottom = false;
  });
  /* R60-1：真相大白音乐开关 */
  var bgmBtn = document.getElementById('bgm-toggle');
  if(bgmBtn) bgmBtn.addEventListener('click', function(e){
    e.stopPropagation();
    if(!truthAudio) return;
    if(truthAudio.paused){ try{ truthAudio.volume = 0.2; truthAudio.play(); }catch(_){} bgmBtn.textContent = '🔊 音乐开'; }
    else { try{ truthAudio.pause(); }catch(_){} bgmBtn.textContent = '🔇 音乐关'; }
  });
  /* R60-7/9：点击灰字提示 → 前往校园论坛私信 */
  document.addEventListener('click', function(e){
    var t = e.target.closest ? e.target.closest('#gate-tip') : null;
    if(t) window.open('forum.html#dm', '_blank');
  });

  /* R54-14 / R59-4：在论坛私信里完成对话（sg_mon_done / sg_plan_done）后自动解锁，
     并把当前页定位到刚解锁的那一页，笔记保持在本界面、可继续翻页阅读 */
  var lastPlanDone = LS.get('sg_plan_done') === '1';
  var lastMonDone  = LS.get('sg_mon_done') === '1';
  setInterval(function(){
    var nowPlan = LS.get('sg_plan_done') === '1';
    var nowMon  = LS.get('sg_mon_done') === '1';
    if(nowPlan !== lastPlanDone || nowMon !== lastMonDone){
      lastPlanDone = nowPlan;
      lastMonDone  = nowMon;
      if(reader.classList.contains('on') && typeof render === 'function'){
        /* R60：灰字提示消失、下一页恢复（分页不再截断，无需重排） */
        render(false);
      }
    }
  }, 1500);

  /* ---------- 翻页 ---------- */
  function go(delta){
    var next = cur + delta * perView;
    if(next < 0) next = 0;
    if(next >= pages.length) return;
    cur = next;
    render(true);
  }
  $('btn-prev').addEventListener('click', function(){ go(-1); });
  $('btn-next').addEventListener('click', function(){ go(1); });
  $('btn-close').addEventListener('click', function(){
    reader.classList.remove('on');
    coverStage.style.display = '';
    window.scrollTo(0, 0);
  });
  document.addEventListener('keydown', function(e){
    if(!reader.classList.contains('on')) return;
    if(e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown'){ e.preventDefault(); if(canGoNext()) go(1); }
    if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); go(-1); }
  });
  /* R54-9 / R59-5：末页点击 → 合上笔记本并显示背面图（左右页都可点） */
  function lastPageTap(e){
    if(e.target.closest('.quiz')) return;
    if(cur + perView < pages.length){ if(canGoNext()) go(1); return; }
    reader.classList.remove('on');
    coverStage.style.display = 'none';
    bottomStage.style.display = 'flex';   /* R66：必须是 flex */
    window.scrollTo(0, 0);
  }
  pgR.addEventListener('click', lastPageTap);
  pgL.addEventListener('click', function(e){
    if(e.target.closest('.quiz')) return;
    /* 末页（最后一张落在左页时）点击也应显示背面，而不是往前翻 */
    if(cur + perView >= pages.length){ lastPageTap(e); return; }
    if(cur > 0) go(-1);
  });

  /* ---------- 星象锁：点击最左端（9 点钟方向）摩羯座扇区 ---------- */
var ZOD = { cx:50.3, cy:39.0, rx:21.1, ry:10.75, a0:165, a1:195 };   /* 按 nb-unlock.jpg 百分比标定 */
var unlockStage = $('unlock-stage'), unlockImg = $('unlock-img'), unlockNope = $('unlock-nope');
var unlocked = false;
try{ unlocked = localStorage.getItem('nb_unlocked') === '1'; }catch(e){}
if(unlocked){
  unlockStage.style.display = 'none';
}else{
  coverStage.style.display = 'none';
  var nopeT = null;
  unlockImg.addEventListener('click', function(e){
    var r = unlockImg.getBoundingClientRect();
    var px = (e.clientX - r.left) / r.width * 100;
    var py = (e.clientY - r.top) / r.height * 100;
    var dx = (px - ZOD.cx) / ZOD.rx, dy = (py - ZOD.cy) / ZOD.ry;
    var dist = Math.sqrt(dx*dx + dy*dy);
    var ang = Math.atan2(dy, dx) * 180 / Math.PI;
    var hit = dist >= 0.5 && dist <= 1.02 && ang >= ZOD.a0 && ang <= ZOD.a1;   /* 最左端扇区 */
    if(hit){
      try{ localStorage.setItem('nb_unlocked', '1'); }catch(e){}
      unlockStage.classList.add('hide');
      setTimeout(function(){
        unlockStage.style.display = 'none';
        coverStage.style.display = '';
      }, 460);
    }else{
      unlockImg.classList.remove('shake'); void unlockImg.offsetWidth; unlockImg.classList.add('shake');
      unlockNope.classList.add('on');
      clearTimeout(nopeT); nopeT = setTimeout(function(){ unlockNope.classList.remove('on'); }, 1400);
    }
  });
}

/* ---------- 打开 ---------- */
  function openBook(){
    var cover = $('book-cover');
    cover.classList.add('opening');
    setTimeout(function(){
      coverStage.style.display = 'none';
      reader.classList.add('on');
      shownBottom = false;      /* R65：每次进入阅读都允许再次到达末页弹封底 */
      cover.classList.remove('opening');
      (ready || Promise.resolve()).then(function(){ layoutAll(); });
    }, 420);
  }
  $('book-cover').addEventListener('click', openBook);
  $('book-cover').addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openBook(); } });

  /* ---------- 预载图片后分页 ---------- */
  var imgs = [];
  CHAPTERS.forEach(function(c){ (c.arts || []).forEach(function(a){ imgs.push(a[0]); }); });
  function preload(){
    return Promise.all(imgs.map(function(src){
      return new Promise(function(res){
        var im = new Image();
        im.onload = function(){ DIMS[src] = [im.naturalWidth, im.naturalHeight]; res(); };
        im.onerror = function(){ DIMS[src] = [4, 3]; res(); };
        im.src = src;
      });
    }));
  }

  function layoutAll(){
    window.__nbGo = function(n){ cur = Math.max(0, Math.min(n, pages.length - 1)); render(false); };
    syncSizes();
    paginate();
    /* R55-10：恢复上次阅读位置（解锁后页数变化时按比例兜底） */
    try{
      var sv = parseInt(LS.get('nb_cur') || '', 10);
      if(!isNaN(sv) && sv >= 0 && sv < pages.length) cur = sv;
    }catch(e){}
    if(cur >= pages.length) cur = 0;
    render(false);
  }

  var rt = null;
  window.addEventListener('resize', function(){
    if(!reader.classList.contains('on')) return;
    clearTimeout(rt);
    rt = setTimeout(function(){ layoutAll(); }, 180);
  });

  var ready = preload().then(function(){
    /* 预分页一次（此时阅读器可能还隐藏，翻开时会重算） */
    if(reader.classList.contains('on')) layoutAll();
  });

  /* 支持从论坛直接打开到指定章节（可选） */
  if(location.hash === '#read'){
    coverStage.style.display = 'none';
    reader.classList.add('on');
    layoutAll();
  }
})();
</script>

<!-- R56：图片放大层 -->
<div id="img-zoom"><img id="img-zoom-img" alt=""></div>
<script>
/* R56-5：所有内容图片点击放大，点击任意处关闭（头像类小图不放大） */
(function(){
  var box = document.getElementById('img-zoom'), big = document.getElementById('img-zoom-img');
  if(!box || !big) return;
  function close(){ box.classList.remove('on'); document.body.classList.remove('zom'); big.src=''; }
  document.addEventListener('click', function(e){
    var t = e.target;
    if(t === box || t === big){ close(); return; }
    if(t && t.tagName === 'IMG'){
      if(t.closest('#img-zoom')) return;
      /* 先排除不可放大的图（头像/广告/封面/解锁图），它们要保留自身点击行为 */
      if(t.closest('[class*="avatar"],[class*="ava"],[class*="logo"],[class*="ad-"]')) return;
      if(t.closest('#unlock-img,#book-cover,#bottom-stage')) return;
      e.stopPropagation();   /* R57：确实要放大时才拦截冒泡，避免同时触发书页翻页 */
      big.src = t.currentSrc || t.src;
      big.alt = t.alt || '';
      box.classList.add('on');
      document.body.classList.add('zom');
    }else if(box.classList.contains('on')){
      close();
    }
  }, true);
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') close(); });
})();
</script>
